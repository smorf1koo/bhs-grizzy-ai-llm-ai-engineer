# Grizzy AI — LLM / AI Engineer test task
# Mini-benchmark: 10 natural-language requests to the project in ../project ("Bear Run").
#
# Fields:
#   id            — stable identifier, use it in eval.md
#   difficulty    — easy | medium | hard
#   request       — the text given to your tool AS IS (you may add an English translation
#                   in your tool, but do not rewrite the request with extra hints)
#   request_en    — English translation (for reference / for models that do worse in Russian)
#   acceptance    — checks for the final diff and for a manual run of the project
#
# Requests are ordered by difficulty.
# BASE part: run only the three requests listed in `base_requests` (one easy, one medium, one hard).
# PLUS part (optional): the remaining seven requests.
# Only `request` (or `request_en`) may be given to the model. `acceptance` is for YOU as the
# evaluator — passing it to the model invalidates the benchmark.
# Do not edit this file; if a request is ambiguous, record your interpretation in eval.md.

project: ../project
godot_min_version: "4.3"
base_requests: [R03, R05, R09]

requests:
  - id: R01
    difficulty: easy
    request: "Сделай так, чтобы игрок прыгал выше — примерно на 30%."
    request_en: "Make the player jump higher, roughly by 30%."
    acceptance:
      - "jump_velocity changed from -450 to about -510..-530 (jump height grows ~30%, height ∝ v²) OR to about -585 (if 30% is interpreted as velocity) — interpretation is stated"
      - "Sign is preserved (negative = up in Godot 2D)"
      - "No other gameplay values changed"

  - id: R02
    difficulty: easy
    request: "Пусть монетки дают 25 очков вместо 10."
    request_en: "Coins should give 25 points instead of 10."
    acceptance:
      - "Collecting a coin adds 25 to the score in HUD"
      - "Enemy stomp score (50) is unchanged"

  - id: R03
    difficulty: easy
    request: "Добавь игроку двойной прыжок."
    request_en: "Add a double jump to the player."
    acceptance:
      - "In the air the player can jump exactly once more; the third press does nothing"
      - "The counter resets on landing"
      - "Walking off a ledge: exactly one air jump is available"
      - "`jumped` signal is emitted for the second jump too"

  - id: R04
    difficulty: medium
    request: "Добавь на HUD счётчик собранных монет в формате «Монеты: 3/8» для текущего уровня."
    request_en: "Add a collected-coins counter to the HUD as 'Coins: 3/8' for the current level."
    acceptance:
      - "Level 1 shows 0/8 at start, level 2 shows 0/12"
      - "Counter increments on each coin; total is computed from the level, not hard-coded"
      - "After death and level reload the counter is consistent with the coins present"
      - "Existing Score/Lives labels still work"

  - id: R05
    difficulty: medium
    request: "Враги на втором уровне должны быть на 50% быстрее, чем сейчас. Первый уровень не трогай."
    request_en: "Enemies on level 2 must be 50% faster than now. Do not touch level 1."
    acceptance:
      - "Each enemy on level 2 moves 1.5x its current speed"
      - "Level 1 enemies and enemy.gd default speed unchanged"

  - id: R06
    difficulty: medium
    request: "После получения урона игрок не должен сразу умирать: дай ему 3 сердца здоровья и 1.5 секунды неуязвимости с миганием после удара. Падение в пропасть по-прежнему убивает сразу."
    request_en: "Taking damage should not kill the player instantly: give 3 hearts of health and 1.5 s of invulnerability with blinking after a hit. Falling into a pit still kills instantly."
    acceptance:
      - "Side contact with an enemy removes 1 heart; the player is pushed back or at least not hit again for 1.5 s"
      - "The sprite blinks during invulnerability"
      - "Third hit → death → existing lose-life flow"
      - "KillZone still kills instantly"
      - "Hearts are visible in HUD (text is fine)"

  - id: R07
    difficulty: medium
    request: "Добавь паузу по клавише Esc: игра останавливается, появляется меню «Продолжить / В главное меню»."
    request_en: "Add pause on Esc: the game stops and a 'Resume / Main menu' menu appears."
    acceptance:
      - "Esc pauses physics and enemies; Esc or 'Resume' resumes"
      - "Menu buttons work while paused (process_mode = always / when paused)"
      - "'Main menu' unpauses the tree before changing scene"
      - "Works on both levels"

  - id: R08
    difficulty: hard
    request: "Добавь движущуюся платформу, которая ездит туда-обратно по горизонтали, и поставь одну такую над пропастью на первом уровне так, чтобы через неё можно было перебраться."
    request_en: "Add a moving platform that goes back and forth horizontally, and place one over a gap on level 1 so it can be used to cross."
    acceptance:
      - "Platform moves smoothly between two points with configurable distance/speed (@export)"
      - "Player standing on it moves together with it (AnimatableBody2D or equivalent)"
      - "It is placed over an existing gap in level 1 and the level is still completable"

  - id: R09
    difficulty: hard
    request: "Сохраняй лучший рекорд между запусками игры и показывай его в главном меню."
    request_en: "Persist the best score between game launches and show it in the main menu."
    acceptance:
      - "Best score is written to user:// on game over AND on victory"
      - "Main menu shows 'Best: N' on startup, including the very first run (no crash if file missing)"
      - "Best score never decreases"

  - id: R10
    difficulty: hard
    request: "Добавь новый тип врага — стрелка: он стоит на месте, раз в 2 секунды стреляет снарядом в сторону игрока, если игрок ближе 400 пикселей. Снаряд убивает игрока при касании и исчезает при столкновении со стеной. Стрелка можно убить прыжком сверху. Поставь по одному стрелку на каждый уровень."
    request_en: "Add a new enemy type — a shooter: stationary, fires a projectile toward the player every 2 s if the player is within 400 px. The projectile kills the player on contact and disappears on hitting a wall. The shooter can be killed by stomping. Place one shooter on each level."
    acceptance:
      - "Shooter fires only when the player is within 400 px, at most once per 2 s"
      - "Projectile moves toward the player's position at the moment of the shot"
      - "Projectile kills the player (via existing die()) and is freed on wall hit or after leaving the screen/lifetime"
      - "Stomp kills the shooter and gives score (reuse of enemy logic is a plus)"
      - "One shooter on each level, placed on solid ground; both levels remain completable"
